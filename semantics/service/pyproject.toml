[project]
name = "frostlog-semantics"
version = "0.1.0"
description = "The frostlog semantics transform service"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.121",
  "uvicorn>=0.42",
  "pydantic>=2.13",
  "pydantic-settings>=2.15",
  "google-cloud-bigquery>=3.41",
  "google-cloud-pubsub>=2.34",
  "google-cloud-storage>=2.19",
  "google-cloud-secret-manager>=2.24",
]

[dependency-groups]
dev = [
  "pytest>=9",
  "ruff>=0.16",
  "ty>=0.0.78",
  "httpx>=0.28",
]
# dbt, which the service runs as a subprocess. It is a separate group so that the
# unit tests and the linters do not have to resolve it alongside the service itself.
transform = [
  "dbt-bigquery>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frostlog_semantics"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

# Without a [tool.ty] section here ty walks up the tree looking for configuration
# and would take whatever is above this directory as the project to check. This
# service is its own project, with its own dependencies.
[tool.ty.src]
include = ["src", "tests"]

[tool.ty.environment]
# "." so that tests/conftest.py is importable as tests.conftest, the way pytest
# sees it (see pythonpath below).
root = ["src", "."]

[tool.pytest.ini_options]
testpaths = ["tests"]
# So that a test can import the fakes from tests/conftest.py by name.
pythonpath = ["."]
