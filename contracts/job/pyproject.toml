[project]
name = "frostlog-contracts"
version = "0.1.0"
description = "The job that holds both frostlog data products to the contracts in contracts/"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic>=2.13",
  "pydantic-settings>=2.15",
  "google-auth>=2.35",
  "google-cloud-pubsub>=2.34",
  "google-cloud-secret-manager>=2.24",
  # The job is a wrapper around this: it shells out to `datacontract test`. The extras
  # are the two places the data actually is -- the bucket through its S3-compatible
  # API, and BigQuery.
  "datacontract-cli[s3,bigquery]>=1.2",
]

[dependency-groups]
dev = [
  "pytest>=9",
  "ruff>=0.16",
  "ty>=0.0.78",
  # The contract-rule tests transpile the contracts' SQL and run it on DuckDB. These
  # come with datacontract-cli too, but the tests import them by name, so they are
  # named here rather than relied upon.
  "duckdb>=1.1",
  "sqlglot>=25",
  "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frostlog_contracts"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

# Without a [tool.ty] section here ty walks up the tree looking for configuration
# and would take whatever is above this directory as the project to check. This job
# is its own project, with its own dependencies.
[tool.ty.src]
include = ["src", "tests"]

[tool.ty.environment]
# "." so that tests/conftest.py is importable as tests.conftest, the way pytest
# sees it (see pythonpath below).
root = ["src", "."]

[tool.pytest.ini_options]
testpaths = ["tests"]
# So that a test can import the fakes from tests/conftest.py by name.
pythonpath = ["."]
