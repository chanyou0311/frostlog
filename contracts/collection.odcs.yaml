# Data contract 1: the collection data product (frostlog collection).
# Open Data Contract Standard v3.2. Source of truth for what the Raspberry Pi
# ships to its bucket; the semantics data product is the only consumer.
apiVersion: v3.2.0
kind: DataContract
id: frostlog-collection
name: frostlog collection
version: 1.0.0
status: draft
domain: frostlog
dataProduct: frostlog-collection
tenant: chanyou

description:
  purpose: >
    Raw record of everything the Raspberry Pi observes about the Anker EverFrost 2
    cooler: every BLE state message (with its bytes, decrypted body and decoded values),
    the temperature and humidity of the air around it at the same moment, and the
    operational events of the collector itself. The cooler is portable — a car, a tent,
    a room — so that air is whatever surrounds it, not a car's cabin. Nothing is
    aggregated, filtered or corrected. Commands the Pi writes to the cooler are observed
    the same way, as events: what was asked for and what the cooler did about it is part
    of the record of how the cooler came to be in the state it is in.
  usage: >
    Read by the semantic data product (frostlog-semantics) to build the dimensional model.
    Delivery is at-least-once, as it is for telemetry generally: a chunk re-cut after a
    partial upload can carry a message that is already here. A repeat is byte-identical,
    so a reader may keep whichever copy it likes — frostlog-semantics keeps the one that
    arrived last, and its tables are one row per message. Deduplicating is the reader's
    job; this product only promises never to lose a message.
    The Bluetooth link belongs to frostlog-gateway rather than to this product: the
    cooler accepts one connection at a time, so one process holds it and this one
    subscribes. That is why a row carries the moment the gateway received the message
    and not the moment it was written down, and why a stream this product could not
    keep up with leaves a row saying so instead of a silent hole.
    A row's original — `frames`, and `plain` where decryption verified — is never
    rewritten. What a row means may be revised: an interpretation error is fixed
    downstream by reading those bytes again, and a message type that becomes decodable
    later may have its `payload` filled in. Filling it in rewrites the object and has to
    load it again, so it takes a migration rather than the arrival path.
  limitations: >
    Data only arrives while the Pi is on the home Wi-Fi (evenings indoors and mornings
    during pre-cooling). Records made right after a reboot may carry a wrong `ts` until
    NTP has synchronized (see `ts_synced`); `boot_id` + `uptime_seconds` give the exact
    order and spacing regardless. Environment readings exist only while the Pi is
    connected to the cooler over BLE. A line the uploader cannot read as one JSON
    object — torn by a power cut, left empty or filled with NUL bytes — may exist in
    the Pi's local files but is never shipped.

servers:
  - server: gcs
    type: s3
    environment: production
    description: >
      Google Cloud Storage bucket accessed through its S3-compatible XML API with HMAC
      keys (the collector uses boto3). Objects are immutable chunks named after the byte
      offset of the Pi's local day file they start at; user metadata carries `start`,
      `end` (byte offsets) and `uploaded-at` (RFC 3339). Layout:
      v1/{stream}/dt=YYYY-MM-DD/{offset:012d}.jsonl.gz, dt = UTC date of `ts`.
      Of that metadata only `end` is ever read back, and only by the collector itself:
      it is where the next run resumes from, and how a refused PUT is recognised as its
      own resend. `uploaded-at` is written for whoever opens the bucket by hand and has
      no reader — downstream is a BigQuery transfer, which loads the lines and not the
      metadata, and the arrival time the semantics product works from is the row's
      ingestion-time partition, not this.
      Collection data is everything under `v1/` and only that; see the controlPrefix
      property for what else lives in the bucket.
    endpointUrl: https://storage.googleapis.com
    location: s3://chanyou-frostlog-collection/v1/{model}/dt=*/*.jsonl.gz
    format: json
    delimiter: new_line
    customProperties:
      - property: bucket
        value: chanyou-frostlog-collection
      - property: region
        value: us-central1
      - property: objectLayout
        value: v1/{stream}/dt=YYYY-MM-DD/{offset:012d}.jsonl.gz
      - property: objectMetadata
        value: start, end, uploaded-at
  - server: samples
    type: local
    environment: ci
    description: >
      Sample chunks checked into the repository for CI conformance tests: one day of
      each stream, as the Pi writes it. They are kept uncompressed because
      datacontract-cli reads only plain `.json` files from a local server; the chunks
      in the bucket are the same lines gzipped.
    path: contracts/samples/collection/{model}/*.json
    format: json
    delimiter: new_line

schema:
  - name: cooler
    physicalName: cooler
    logicalType: object
    description: >
      One row per message received from the cooler over BLE. Rows are written when the
      cooler updates its state (on any value change, at least every 10 minutes as a
      heartbeat, and once after each connection). The surrounding air is measured at
      the same moment and stored on the same row.
    dataGranularityDescription: One BLE message from the cooler, with the environment at that moment.
    properties:
      - name: ts
        logicalType: timestamp
        physicalType: string
        required: true
        description: >
          Wall-clock time of the record in UTC (RFC 3339). Taken from the Pi's clock,
          which may be wrong until NTP has synchronized after a boot; see ts_synced.
        examples: ["2026-09-06T11:02:11.586699Z"]
      - name: uptime_seconds
        logicalType: number
        required: true
        description: Seconds since the Pi booted (CLOCK_BOOTTIME). Monotonic within a boot; the authoritative order and spacing of records.
      - name: boot_id
        logicalType: string
        required: true
        description: Linux boot identifier (/proc/sys/kernel/random/boot_id). Changes on every reboot; uptime_seconds restarts from 0 with it.
      - name: ts_synced
        logicalType: boolean
        required: false
        description: >
          True when the Pi's clock had been synchronized with NTP when the record was
          made (systemd-timesyncd). False means ts may be off by the time the Pi was
          powered down. Null only in rows migrated from before this field existed.
      - name: type
        logicalType: string
        required: true
        description: Stream discriminator. Always "cooler" in this object.
        enum:
          - value: cooler
      - name: model
        logicalType: string
        required: true
        description: Which decoder produced `payload`. Currently always "everfrost".
        examples: ["everfrost"]
      - name: address
        logicalType: string
        required: true
        description: Bluetooth device address of the cooler the message came from.
        examples: ["F4:9D:8A:C3:4F:84"]
      - name: pattern
        logicalType: string
        required: false
        description: Frame header pattern (3 bytes, hex). 030001 = connection handshake, 03010f = status/telemetry. Absent when the notification was not a valid frame.
        examples: ["03010f"]
      - name: cmd
        logicalType: string
        required: false
        description: Frame header command (2 bytes, hex). 4402 = state report and 4840 = the answer to a state request, both decoded into payload; 4489 = external input connected/disconnected, 4500 = 10-minute message of unknown meaning, 08xx/4822 = handshake replies, 48xx = the cooler acknowledging a command it was sent (4880 for a setpoint).
        examples: ["4402"]
      - name: frames
        logicalType: array
        required: true
        description: >
          The BLE notifications this message arrived in, each as the exact bytes received
          (hex). A message longer than the MTU is split into several notifications; they
          are listed in order. This is the original: everything else on the row is derived.
        items:
          logicalType: string
      - name: plain
        logicalType: string
        required: false
        description: >
          The message body in the clear (hex): the payload as sent for unencrypted handshake
          messages, or the AES-decrypted payload once the session is encrypted. Present only
          when decryption verified; absent on failure (frames and error remain).
      - name: payload
        logicalType: object
        required: false
        description: >
          The decoded body for message types whose meaning is known: cmd 4402 and 4840,
          which carry the same body under different headers. Values are in SI-style units
          regardless of the cooler's display unit. Absent for other message types and
          whenever plain is absent.
        properties:
          - name: setpoint_celsius
            logicalType: integer
            required: true
            description: Target temperature in °C (normalized from the display unit).
          - name: interior_temperature_celsius
            logicalType: integer
            required: true
            description: Measured interior temperature in °C (normalized from the display unit).
          - name: display_unit
            logicalType: string
            required: true
            description: Unit the cooler was displaying when it sent the message.
            enum:
              - value: C
              - value: F
          - name: input_watts
            logicalType: integer
            required: true
            description: Power drawn from the external DC input (car socket or AC adapter). 0 when no input.
          - name: usb_a_output_watts
            logicalType: integer
            required: true
            description: Power supplied on the USB-A port (1 W resolution).
          - name: usb_c_output_watts
            logicalType: integer
            required: true
            description: Power supplied on the USB-C port (1 W resolution).
          - name: charge_watts
            logicalType: integer
            required: true
            description: Power flowing into the battery.
          - name: discharge_watts
            logicalType: integer
            required: true
            description: Power flowing out of the battery (compressor, USB outputs).
          - name: battery_state
            logicalType: string
            required: true
            description: >
              State of the removable battery. `full` is charging finished: the cooler is
              on external power at 100 % with no current flowing either way.
            enum:
              - value: idle
              - value: charging
              - value: discharging
              - value: full
              - value: absent
          - name: state_of_charge_percent
            logicalType: integer
            required: true
            description: Battery state of charge in percent as shown on the cooler's display. 0 when the battery is absent.
          - name: protection_level
            logicalType: string
            required: true
            description: Battery protection level setting.
            enum:
              - value: L
              - value: M
              - value: H
          - name: brightness
            logicalType: string
            required: true
            description: Display brightness setting.
            enum:
              - value: low
              - value: mid
              - value: high
          - name: serial_number
            logicalType: string
            required: true
            description: Serial number of the cooler.
          - name: battery_serial_number
            logicalType: string
            required: false
            description: Serial number of the battery. Absent when no battery is installed.
      - name: environment
        logicalType: object
        required: false
        description: Cabin temperature and humidity measured by the Pi's sensor at the moment the message was received. Absent when the sensor read failed.
        properties:
          - name: sensor
            logicalType: string
            required: true
            description: Sensor name.
            examples: ["dht20"]
          - name: temperature_celsius
            logicalType: number
            required: true
            description: Air temperature at the Pi in °C.
          - name: humidity_percent
            logicalType: number
            required: true
            description: Relative humidity at the Pi in percent.
      - name: error
        logicalType: string
        required: false
        description: Why the message could not be assembled or decrypted (e.g. "incomplete", "fragment 3/2 out of order"). Present only on failure.
    quality:
      - name: repeated_messages_agree
        type: sql
        dimension: consistency
        description: >
          A message is identified by (boot_id, uptime_seconds) and may arrive more than
          once. Every copy must carry the same frames: that is what makes "keep the one
          that arrived last" a choice between equals rather than a coin toss.
        query: >
          SELECT COUNT(*) FROM (
            SELECT boot_id, uptime_seconds
            FROM {model}
            WHERE boot_id IS NOT NULL AND uptime_seconds IS NOT NULL
            GROUP BY boot_id, uptime_seconds
            HAVING COUNT(DISTINCT array_to_string(frames, ',')) > 1
          )
        mustBe: 0
      - name: frames_present
        type: sql
        dimension: completeness
        description: Every row keeps the original notification bytes.
        query: SELECT COUNT(*) FROM {model} WHERE frames IS NULL OR len(frames) = 0
        mustBe: 0
      - name: state_of_charge_in_range
        type: sql
        dimension: conformity
        description: Decoded state of charge is a percentage.
        query: SELECT COUNT(*) FROM {model} WHERE payload.state_of_charge_percent < 0 OR payload.state_of_charge_percent > 100
        mustBe: 0
      - name: temperatures_in_range
        type: sql
        dimension: conformity
        description: Decoded and measured temperatures are physically plausible (−40 to 85 °C).
        query: >
          SELECT COUNT(*) FROM {model}
          WHERE payload.interior_temperature_celsius NOT BETWEEN -40 AND 85
             OR payload.setpoint_celsius NOT BETWEEN -40 AND 85
             OR environment.temperature_celsius NOT BETWEEN -40 AND 85
        mustBe: 0
      - name: payload_only_with_plain
        type: sql
        dimension: consistency
        description: A decoded payload exists only when the body was readable.
        query: SELECT COUNT(*) FROM {model} WHERE payload IS NOT NULL AND plain IS NULL
        mustBe: 0

  - name: events
    physicalName: events
    logicalType: object
    description: >
      One row per thing that happened on the cooler's link other than a message from the
      cooler itself: BLE connection milestones and failures (observed by the gateway that
      holds the link, recorded here), each step of a command written to the cooler, and
      the collector's own events — environment sensor failures, upload runs, and what it
      saw of the gateway's stream. This is the collection data product's own observability
      data. Known kinds are listed; consumers must tolerate new kinds.
      Commands live here rather than in a stream of their own because a stream is a
      transfer and a table as well as a prefix, and a command is a handful of rows a day:
      one row per step, identified like every other event by (boot_id, uptime_seconds,
      kind), with the steps of one command tied together by command_id.
    dataGranularityDescription: One event on the cooler's link, or one of the collector's own.
    properties:
      - name: ts
        logicalType: timestamp
        physicalType: string
        required: true
        description: Event time in UTC (RFC 3339), same caveats as cooler.ts.
      - name: uptime_seconds
        logicalType: number
        required: true
        description: Seconds since boot.
      - name: boot_id
        logicalType: string
        required: true
        description: Linux boot identifier.
      - name: ts_synced
        logicalType: boolean
        required: false
        description: Whether the clock was NTP-synchronized when the event was recorded.
      - name: type
        logicalType: string
        required: true
        description: Stream discriminator. Always "event" in this object.
        enum:
          - value: event
      - name: kind
        logicalType: string
        required: true
        description: >
          What happened. Known values: ble_device_not_found, ble_error, ble_connected,
          ble_negotiated, ble_handshake_retry, ble_negotiation_timeout, ble_handshake_failed,
          ble_disconnected, ble_silent (no message for a while, link dropped),
          environment_read_failed, upload_started, upload_done;
          command_requested (something asked for a setting to be changed),
          command_rejected (it was never written; error says why),
          command_sent (the frame went to the cooler),
          command_accepted (the cooler acknowledged it),
          command_applied (a later state report shows the value asked for),
          command_unconfirmed (neither happened before the gateway gave up waiting);
          gateway_connected and gateway_disconnected (the collector reached the gateway's
          stream, or lost it — while it is lost nothing is being recorded),
          gateway_dropped (the gateway dropped `count` events because this collector was
          reading too slowly), gateway_gap (the numbering jumped from `expected` to
          `received` for some other reason; the events between are gone).
          Other kinds may appear.
      - name: address
        logicalType: string
        required: false
        description: Bluetooth address involved (ble_* kinds, and the command_* kinds that name the cooler written to).
      - name: name
        logicalType: string
        required: false
        description: Advertised device name (ble_connected).
      - name: error
        logicalType: string
        required: false
        description: >
          Error text (ble_error, ble_handshake_failed, environment_read_failed,
          gateway_disconnected). For command_rejected, why it was not written
          (not_connected, negotiating, state_unknown, unknown_setting, value_out_of_range,
          busy, invalid_request); for command_unconfirmed, what was still missing.
      - name: variant
        logicalType: string
        required: false
        description: Handshake variant tried (solix, prime).
      - name: mtu
        logicalType: integer
        required: false
        description: Negotiated BLE MTU (ble_negotiated).
      - name: chip
        logicalType: string
        required: false
        description: Cooler chip reported during the handshake (ble_negotiated).
      - name: firmware
        logicalType: string
        required: false
        description: Cooler firmware version reported during the handshake (ble_negotiated). Source of dim_cooler history.
      - name: serial
        logicalType: string
        required: false
        description: Cooler serial number reported during the handshake (ble_negotiated).
      - name: secret
        logicalType: string
        required: false
        description: >
          Deprecated, and no longer written. The session key (hex) derived during the
          handshake (ble_negotiated), which let frames be decrypted again later. It was
          recorded while nothing could be written to the cooler; once commands became
          possible, a key to the cooler sitting in a bucket bought a convenience that was
          never worth it — and a key is only good within the connection it was made for
          anyway. Rows recorded before that still carry it.
      - name: cmd
        logicalType: string
        required: false
        description: >
          Frame header command (2 bytes, hex): the handshake command that failed
          (ble_handshake_failed), or the command written to the cooler (command_sent).
      - name: sensor
        logicalType: string
        required: false
        description: Sensor name (environment_read_failed).
      - name: command_id
        logicalType: string
        required: false
        description: What ties the steps of one command together (command_* kinds). A UUID, new for every request.
      - name: source
        logicalType: string
        required: false
        description: Who asked for the command (command_requested). Free short text, e.g. the name of the unit that sent it.
      - name: reason
        logicalType: string
        required: false
        description: Why it was asked for (command_requested). Free short text, e.g. the change of circumstance that triggered it.
      - name: setting
        logicalType: string
        required: false
        description: Which setting the command changes (command_requested), named as in cooler.payload.
      - name: value
        logicalType: string
        required: false
        description: >
          The value asked for (command_requested), as text. Settings do not share a type —
          a temperature, a level, a switch — and one column that holds them all keeps the
          events stream one table; a consumer casts it per setting.
      - name: frames
        logicalType: array
        required: false
        description: >
          The frame written to the cooler (command_sent), as the exact bytes sent (hex).
          The same idea as cooler.frames: the original, from which everything else about
          the command could be read again.
        items:
          logicalType: string
      - name: count
        logicalType: integer
        required: false
        description: How many events the gateway dropped because this collector was reading too slowly (gateway_dropped).
      - name: expected
        logicalType: integer
        required: false
        description: The stream number the next event should have had (gateway_gap).
      - name: received
        logicalType: integer
        required: false
        description: The stream number it actually had (gateway_gap); the events in between were lost.
      - name: uploaded_chunk_count
        logicalType: integer
        required: false
        description: Number of chunks put in this upload run (upload_done).
      - name: uploaded_line_count
        logicalType: integer
        required: false
        description: Number of lines shipped in this upload run (upload_done).
    quality:
      - name: repeated_events_agree
        type: sql
        dimension: consistency
        description: >
          An event is identified by (boot_id, uptime_seconds, kind) and, like a cooler
          message, may arrive more than once. Every copy must agree on when it happened.
        query: >
          SELECT COUNT(*) FROM (
            SELECT boot_id, uptime_seconds, kind
            FROM {model}
            WHERE boot_id IS NOT NULL AND uptime_seconds IS NOT NULL
            GROUP BY boot_id, uptime_seconds, kind
            HAVING COUNT(DISTINCT CAST(ts AS VARCHAR)) > 1
          )
        mustBe: 0

slaProperties:
  - property: latency
    value: 5
    unit: m
    element: cooler.ts
    description: While the Pi is on the home Wi-Fi, a record is in the bucket within 5 minutes of being made (upload timer). No promise while away.
  - property: frequency
    value: 5
    unit: m
    element: cooler.ts
    description: Upload runs every 5 minutes; a run only ships new lines.
  - property: retention
    value: unlimited
    element: cooler.ts
    description: Objects are never deleted from the bucket. The Pi keeps its local copy for 30 days.
  - property: timeliness
    value: 1
    unit: d
    element: cooler.ts
    description: Warn when no new record has arrived for more than 1 day; error after 7 days (the car comes home almost daily, trips of a few days happen).
  - property: availability
    value: best-effort
    description: Availability follows Google Cloud Storage; there is no additional guarantee.

support:
  - channel: github
    url: https://github.com/chanyou0311/frostlog/issues
    tool: other
    scope: issues

team:
  name: frostlog
  members:
    - username: chanyou0311
      role: owner

customProperties:
  - property: changePolicy
    value: additive-only
    description: Fields and event kinds may be added. Removing or re-typing a field, or changing a meaning, bumps the major version and moves the data to a new path prefix (v2/). This holds from the moment the contract's status is `active`; while it is a draft the shape is still being settled and may change in ways a consumer could not survive, which is what draft means and why CI checks for breaking changes only once a contract is active.
  - property: chunkSemantics
    value: immutable-offset-chunks
    description: Each object holds whole lines of one local day file starting at the byte offset in its name; the same offset always means the same lines, so re-uploads overwrite identical bytes. Upload state is derived from the bucket (LIST + metadata `end`), never kept on the Pi.
  - property: controlPrefix
    value: _control/
    description: >
      The bucket also lends `_control/` to the semantics data product as its own
      workspace: `_control/built_through.json` is the row count each raw table stood at
      when its last build ran, kept here because reading a bucket object is free and
      reading a warehouse row is not. Objects under that prefix are not collected data
      and this contract says nothing about their shape — the collector neither writes
      nor reads them, and the transfer that loads this bucket matches `v1/` only.
  - property: lateArrival
    value: unbounded
    description: Records for a past day may arrive days later (after a trip). Consumers must expect new chunks in old dt= partitions.
