# Data contract for the Pub/Sub topic the frostlog components signal each other on.
# Not one product's output: `semantic_updated` comes from the semantics transform,
# `quality_report` from the contract-test job, and one consumer reads both off one
# subscription. Signals rather than events, because the collection product already has
# an `events` stream — the Pi's own operational records — and the two are not the same
# thing. Its own file because datacontract-cli tests every schema object of a contract
# against the selected server, and messages are not tables.
apiVersion: v3.2.0
kind: DataContract
id: frostlog-signals
name: frostlog signals
version: 1.0.0
status: draft
domain: frostlog
dataProduct: frostlog-signals
tenant: chanyou

description:
  purpose: >
    Tell consumers when the semantics tables changed (semantic_updated) and what the daily
    contract tests found (quality_report), so they react to new data without polling.
  usage: >
    Consumed by frostlog-notifier through a Pub/Sub push subscription. Message bodies are
    JSON objects with the fields below; unknown fields must be ignored.
  limitations: >
    Delivery is at-least-once: consumers deduplicate on run_id. Events are published only
    for runs whose build passed.

servers:
  - server: signals
    type: pubsub
    environment: production
    description: Pub/Sub topic carrying the semantic_updated and quality_report messages.
    project: chanyou-frostlog
    topic: frostlog-signals

schema:
  - name: semantic_updated
    physicalName: semantic_updated
    logicalType: object
    description: >
      Event published on the Pub/Sub topic after each transform run that rebuilt tables.
      Consumers use it to react to new data without polling.
    dataGranularityDescription: One transform run.
    properties:
      - name: event
        logicalType: string
        required: true
        description: Which event this is; consumers branch on it, not on which fields are present.
        examples: ["semantic_updated"]
      - name: run_id
        logicalType: string
        required: true
        description: Identifier of the transform run.
      - name: published_at
        logicalType: timestamp
        required: true
      - name: rows_arrived
        logicalType: integer
        required: true
        description: How many raw rows this run was given that the previous one was not. Every table is rebuilt in full regardless, so this says how much was new, not what was rebuilt.
      - name: build_passed
        logicalType: boolean
        required: true
        description: Always true in this version (reserved). A run whose dbt build failed publishes no event at all; it answers 500 and is delivered again.
      - name: upload_runs
        logicalType: array
        required: false
        description: >
          The collector's upload runs that reached the warehouse lately: the
          `upload_done` events in raw whose ingestion-time partition falls in the
          build's lookback window (a day and an hour — longer than the hourly
          schedule, so a run that ended between two builds is still reported). Empty
          when no such event arrived. Nothing ties this to what arrived in the other
          stream: the row counts decide whether to build and rows_arrived says how
          much was new, while this says who was uploading.

          The window is on arrival rather than on the event's own `ts`, because a run
          that ends just after the car comes home is the run whose clock is least to
          be trusted — the Pi's wall clock is whatever the hardware clock kept while
          the power was off, until NTP catches up — and it is also the run a consumer
          most wants announced. A backlog that lands days after it was recorded is
          therefore announced when it lands, carrying its own (possibly wrong) `ts` in
          finished_at.

          The window is far longer than the gap between builds, and rounded outwards
          to the day, so the same run is reported by more than one event; consumers
          deduplicate on finished_at.

          It is the report of a run having ended, and no more than that. It does not
          say that the run's chunks are loaded, or transformed, or that the run
          shipped everything it had: a transfer picks the bucket up on its own
          schedule, and the collector writes upload_done after the PUTs that succeeded
          rather than after the ones it owed. So a consumer summarises from the model
          as it stands when the event arrives, and what it summarised may change later.

          previous_finished_at is the end of the run before this one. What a long gap
          between the two means — a trip, a cooler switched off, a Pi that could not
          reach the bucket — is the consumer's reading, not this contract's.
        items:
          logicalType: object
          properties:
            - name: finished_at
              logicalType: timestamp
              required: true
              description: When the upload run finished (the upload_done event).
            - name: started_at
              logicalType: timestamp
              required: false
              description: When the same boot's upload run started (the upload_started before it).
            - name: previous_finished_at
              logicalType: timestamp
              required: false
              description: When the upload run before this one finished, whichever boot it belonged to.
            - name: chunk_count
              logicalType: integer
              required: true
              description: Chunks put in the bucket by this run.
            - name: line_count
              logicalType: integer
              required: true
              description: Lines shipped by this run.
  - name: quality_report
    physicalName: quality_report
    logicalType: object
    description: >
      Event published on the same topic by the daily contract test run: the result of
      testing this contract and the collection contract against production data.
    dataGranularityDescription: One daily contract test run.
    properties:
      - name: event
        logicalType: string
        required: true
        description: Which event this is; consumers branch on it, not on which fields are present.
        examples: ["quality_report"]
      - name: run_id
        logicalType: string
        required: true
      - name: published_at
        logicalType: timestamp
        required: true
      - name: contract_id
        logicalType: string
        required: true
        description: frostlog-collection or frostlog-semantics.
      - name: passed
        logicalType: boolean
        required: true
      - name: failed_checks
        logicalType: array
        required: true
        description: Names of the quality checks that failed (empty when passed).
        items:
          logicalType: string

slaProperties:
  - property: latency
    value: 1
    unit: m
    element: semantic_updated.published_at
    description: Published right after the transform run that rebuilt tables; the notifier receives it within about a minute.
  - property: frequency
    value: hourly
    description: >
      semantic_updated at most once an hour: the transform is scheduled hourly and
      publishes only when raw holds rows the last build was not given, so a quiet hour
      produces no event at all. quality_report daily.

support:
  - channel: github
    url: https://github.com/chanyou0311/frostlog/issues
    tool: other
    scope: issues

team:
  name: frostlog
  members:
    - username: chanyou0311
      role: owner

customProperties:
  - property: changePolicy
    value: additive-only
    description: Fields may be added; renaming, removing or re-typing a field bumps the major version and is published as a new event name. This holds from the moment the contract's status is `active`; while it is a draft the shape is still being settled and may change in ways a consumer could not survive, which is what draft means and why CI checks for breaking changes only once a contract is active.
