[project]
name = "frostlog"
version = "0.1.0"
description = "Data logger for a portable cooler (Anker EverFrost 2) and its surroundings, running on a Raspberry Pi"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "pydantic>=2.13",
  "pydantic-settings>=2.15",
  "typer>=0.27",
  "smbus2>=0.6",
  "boto3>=1.43",
  # A transitive dependency of pydantic, listed here only so that the piwheels source
  # below applies to it (uv sources cover direct dependencies).
  "pydantic-core>=2.46",
]

[project.scripts]
frostlog = "frostlog.cli:app"

[dependency-groups]
dev = [
  "pytest>=9",
  "ruff>=0.16",
  "ty>=0.0.78",
  # The sample builder turns messages the cooler really sent into records, and the
  # EverFrost decoder that reads them lives in the gateway now. Nothing the collector
  # ships needs it: the gateway decodes, and this product records what it is handed.
  "frostlog-gateway",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frostlog"]

# The Raspberry Pi Zero is armv6l. PyPI has no armv6l wheels for the compiled
# packages below, so on that machine they come from piwheels instead.
[[tool.uv.index]]
name = "piwheels"
url = "https://www.piwheels.org/simple"
explicit = true

[tool.uv.sources]
pydantic-core = [{ index = "piwheels", marker = "platform_machine == 'armv6l'" }]
frostlog-gateway = { path = "../gateway" }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # captured byte sequences are long

[tool.ty.src]
# Without this ty walks up the tree looking for configuration and would take
# whatever is above this directory as the project to check. scripts/ is listed
# because `include` replaces the default of "everything here", and the sample
# builder was checked before the package moved into this directory.
include = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# The messages the cooler really sent live with the code that speaks to it; the
# sample builder reads them from there, the way the gateway's tests do.
[tool.ty.environment]
extra-paths = ["../gateway/tests"]
