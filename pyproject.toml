[project]
name = "frostlog"
version = "0.1.0"
description = "Data logger for a portable cooler (Anker EverFrost 2) and its surroundings, running on a Raspberry Pi"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "pydantic>=2.13",
  "pydantic-settings>=2.15",
  "typer>=0.27",
  "smbus2>=0.6",
  "bleak>=3.0",
  "cryptography>=50",
  "boto3>=1.43",
  # Transitive dependencies of pydantic and cryptography, listed here only so that
  # the piwheels source below applies to them (uv sources cover direct dependencies).
  "pydantic-core>=2.46",
  "cffi>=2.0",
]

[project.scripts]
frostlog = "frostlog.cli:app"

[dependency-groups]
dev = [
  "pytest>=9",
  "ruff>=0.16",
  "ty>=0.0.78",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frostlog"]

# The Raspberry Pi Zero is armv6l. PyPI has no armv6l wheels for the compiled
# packages below, so on that machine they come from piwheels instead.
[[tool.uv.index]]
name = "piwheels"
url = "https://www.piwheels.org/simple"
explicit = true

[tool.uv.sources]
cryptography = [{ index = "piwheels", marker = "platform_machine == 'armv6l'" }]
cffi = [{ index = "piwheels", marker = "platform_machine == 'armv6l'" }]
pydantic-core = [{ index = "piwheels", marker = "platform_machine == 'armv6l'" }]

# dbus-fast (used by bleak on Linux) has no armv6l wheel anywhere; build the
# pure-Python variant from its sdist instead of compiling the Cython modules.
[tool.uv.extra-build-variables]
dbus-fast = { SKIP_CYTHON = "1" }

[tool.ruff]
line-length = 100
target-version = "py313"
# The cloud services under semantic/ are their own uv project with their own
# dependencies; the ci workflow checks them from there.
extend-exclude = ["semantic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # captured byte sequences are long

[tool.ty.src]
# The cloud services have their own project, environment and checks; the Pi's
# environment does not contain their dependencies.
exclude = ["semantic"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# `tests/captured.py` holds the messages the cooler really sent; the sample builder
# reads them too, the way pytest does.
[tool.ty.environment]
extra-paths = ["tests"]
