[project]
name = "frostlog-notifier"
version = "0.1.0"
description = "Slack notification application for the frostlog semantic data product"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "google-cloud-bigquery>=3.25",
  "matplotlib>=3.9",
  "slack-sdk>=3.33",
  "pydantic>=2.13",
  "pydantic-settings>=2.15",
  "tzdata>=2024.1",
]

[dependency-groups]
dev = [
  "pytest>=9",
  "ruff>=0.16",
  "ty>=0.0.78",
  "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frostlog_notifier"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies as call defaults.
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
python = ".venv"
