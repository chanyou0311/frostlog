# Build the Cloud Run images and swap them in. The services and the job themselves
# (sizing, service accounts, env vars, triggers) are defined in fumo-terraform
# (envs/gcp-chanyou-frostlog); this workflow only updates the container image.
# Every deployable has an image of its own and is named after it, so the image and
# what runs it can be read off each other.
# Auth is Workload Identity Federation: the repository variable
# FROSTLOG_GCP_PROJECT_NUMBER must be set once after the project is bootstrapped.
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "semantics/**"
      - "notifier/**"
      - "contracts/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

env:
  PROJECT_ID: chanyou-frostlog
  REGION: us-central1
  REPOSITORY: frostlog

jobs:
  deploy:
    if: ${{ vars.FROSTLOG_GCP_PROJECT_NUMBER != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # semantics and contracts each need something that sits beside them rather
          # than inside them (the dbt project, the contract files), so they build from
          # the repository root; notifier is self-contained in its own directory.
          - name: frostlog-semantics
            kind: service
            dockerfile: semantics/Dockerfile
            context: .
          - name: frostlog-contracts
            kind: job
            dockerfile: contracts/Dockerfile
            context: .
          - name: frostlog-notifier
            kind: service
            dockerfile: notifier/Dockerfile
            context: notifier
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ vars.FROSTLOG_GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: frostlog-deployer@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ matrix.name }}
        run: |
          docker build -f ${{ matrix.dockerfile }} -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" ${{ matrix.context }}
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Update the Cloud Run service image
        if: ${{ matrix.kind == 'service' }}
        run: |
          gcloud run services update ${{ matrix.name }} \
            --project=${{ env.PROJECT_ID }} --region=${{ env.REGION }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ matrix.name }}:${{ github.sha }}

      - name: Update the Cloud Run job image
        if: ${{ matrix.kind == 'job' }}
        run: |
          gcloud run jobs update ${{ matrix.name }} \
            --project=${{ env.PROJECT_ID }} --region=${{ env.REGION }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ matrix.name }}:${{ github.sha }}
