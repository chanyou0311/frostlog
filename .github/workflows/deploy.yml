# Build the Cloud Run images and swap them in. The services and the job themselves
# (sizing, service accounts, env vars, triggers) are defined in fumo-terraform
# (envs/gcp-chanyou-frostlog); this workflow only updates the container image.
# One image can carry more than one deployable: the contract-test job runs from the
# semantics image with a command of its own, so it is updated alongside it.
# Auth is Workload Identity Federation: the repository variable
# FROSTLOG_GCP_PROJECT_NUMBER must be set once after the project is bootstrapped.
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "semantics/**"
      - "notifier/**"
      - "contracts/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

env:
  PROJECT_ID: chanyou-frostlog
  REGION: us-central1
  REPOSITORY: frostlog

jobs:
  deploy:
    if: ${{ vars.FROSTLOG_GCP_PROJECT_NUMBER != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # semantics builds from the repository root (it bakes in contracts/), and its
          # image is what the contract-test job runs too; notifier is self-contained in
          # its own directory.
          - service: frostlog-semantics
            dockerfile: semantics/Dockerfile
            context: .
            job: frostlog-contracts
          - service: frostlog-notifier
            dockerfile: notifier/Dockerfile
            context: notifier
            job: ""
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ vars.FROSTLOG_GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: frostlog-deployer@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ matrix.service }}
        run: |
          docker build -f ${{ matrix.dockerfile }} -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" ${{ matrix.context }}
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Update the Cloud Run service image
        run: |
          gcloud run services update ${{ matrix.service }} \
            --project=${{ env.PROJECT_ID }} --region=${{ env.REGION }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ matrix.service }}:${{ github.sha }}

      - name: Update the Cloud Run job image
        if: ${{ matrix.job != '' }}
        run: |
          gcloud run jobs update ${{ matrix.job }} \
            --project=${{ env.PROJECT_ID }} --region=${{ env.REGION }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ matrix.service }}:${{ github.sha }}
