name: ci

on:
  pull_request:
    # "edited" covers a stacked PR being retargeted after its base branch merges.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

env:
  UV_VERSION: "0.12.10"
  DATACONTRACT_CLI: "datacontract-cli[s3]==1.2.0"

jobs:
  # The collector: the Pi's package at the repository root.
  collector:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest

  # The two data contracts are the source of truth; nothing is generated from
  # them, so they are checked directly: well-formed, no breaking change against
  # main, and the raw contract holds for the sample chunks built from real messages.
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # datacontract breaking compares against main
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
      - name: datacontract lint
        run: |
          for contract in raw semantic; do
            uvx --python 3.13 --from "$DATACONTRACT_CLI" datacontract lint "contracts/$contract.odcs.yaml"
          done
      - name: datacontract breaking (against main)
        run: |
          git fetch --depth=1 origin main
          for contract in raw semantic; do
            path="contracts/$contract.odcs.yaml"
            if git cat-file -e "origin/main:$path" 2>/dev/null; then
              git show "origin/main:$path" > "$RUNNER_TEMP/$contract.odcs.yaml"
              uvx --python 3.13 --from "$DATACONTRACT_CLI" datacontract breaking \
                "$RUNNER_TEMP/$contract.odcs.yaml" "$path"
            else
              echo "$path is not on main yet; nothing to compare against"
            fi
          done
      - name: datacontract test (raw contract vs sample chunks)
        run: uvx --python 3.13 --from "$DATACONTRACT_CLI" datacontract test contracts/raw.odcs.yaml --server samples

  # The semantic data product without a warehouse: service checks and dbt parse.
  semantic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
      - run: make -C semantic install
      - run: make -C semantic check

  # The Slack data application.
  notifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: notifier
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest

  # The container images must at least build; deploy.yml pushes them from main.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: semantic/Dockerfile
            context: . # bakes in contracts/
          - dockerfile: notifier/Dockerfile
            context: notifier
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f ${{ matrix.dockerfile }} ${{ matrix.context }}

  # What needs BigQuery: the sample chunks are loaded into the CI dataset, the
  # dbt project is built and unit-tested there, and the semantic contract is
  # tested against the result. Runs only once the GCP project is wired up
  # (repository variable FROSTLOG_GCP_PROJECT_NUMBER), as frostlog-ci via
  # Workload Identity Federation; one run at a time because the dataset is shared.
  warehouse:
    if: ${{ vars.FROSTLOG_GCP_PROJECT_NUMBER != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: frostlog-ci-warehouse
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      FROSTLOG_GCP_PROJECT: chanyou-frostlog # the service's settings (sample load)
      FROSTLOG_BQ_PROJECT: chanyou-frostlog  # dbt's profiles.yml (build, unit tests)
      FROSTLOG_BQ_DATASET_CI: frostlog_ci
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ vars.FROSTLOG_GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: frostlog-ci@${{ env.FROSTLOG_GCP_PROJECT }}.iam.gserviceaccount.com
      - run: make -C semantic install
      - run: make -C semantic ci-warehouse
