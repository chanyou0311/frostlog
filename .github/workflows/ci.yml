name: ci

on:
  pull_request:
    # "edited" covers a stacked PR being retargeted after its base branch merges.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

# A push to a branch that is already being checked supersedes the check in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.10"

jobs:
  # Which of the expensive jobs the change can affect. The unit checks are cheap
  # and always run; building three images and rebuilding the CI warehouse are not,
  # and a change to a README or to the Pi's package cannot change their outcome.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      images: ${{ steps.filter.outputs.images }}
      warehouse: ${{ steps.filter.outputs.warehouse }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            images:
              - 'semantics/**'
              - 'contracts/**'
              - 'notifier/**'
              - '.dockerignore'
              - '!**/*.md'
            warehouse:
              - 'semantics/**'
              - 'contracts/**'
              - '.github/workflows/ci.yml'
              - '!**/*.md'

  # The collection data product: the Pi's package.
  collection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
      - run: make -C collection install
      - run: make -C collection check

  # The one process that holds the cooler's Bluetooth link. The radio is faked in
  # its tests and its sockets are real ones in a temporary directory, so no Pi and
  # no cooler are needed here either.
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
      - run: make -C gateway install
      - run: make -C gateway check

  # The three data contracts are the source of truth; nothing is generated from
  # them, so they are checked directly: well-formed, no breaking change against
  # main, and the collection contract holds for the sample chunks built from real
  # messages. The job that holds production to those same contracts lives here too.
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # datacontract breaking compares against main
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
      - run: make -C contracts install
      - run: make -C contracts check
      - run: make -C contracts lint
      # A contract promises nothing until it says it is active. While it is a draft
      # its shape is still being settled and may change in ways a consumer could not
      # survive -- there is no consumer yet. What `active` turns on is this check,
      # and with it the additive-only policy the contracts declare.
      - name: datacontract breaking (active contracts, against main)
        run: |
          git fetch --depth=1 origin main
          for path in contracts/*.odcs.yaml; do
            status=$(sed -n 's/^status: *//p' "$path" | head -1)
            if [ "$status" != "active" ]; then
              echo "$path is $status; a breaking change is allowed until it is active"
              continue
            fi
            if git cat-file -e "origin/main:$path" 2>/dev/null; then
              git show "origin/main:$path" > "$RUNNER_TEMP/$(basename "$path")"
              uv run --project contracts/job datacontract breaking \
                "$RUNNER_TEMP/$(basename "$path")" "$path"
            else
              echo "$path is not on main yet; nothing to compare against"
            fi
          done
      # The samples server's paths are relative to the repository root, so this one
      # runs from there rather than through contracts/Makefile.
      - name: datacontract test (collection contract vs sample chunks)
        run: uv run --project contracts/job datacontract test contracts/collection.odcs.yaml --server samples

  # The controller: the Pi's presence-triggered setpoint job.
  controller:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
      - run: make -C controller install
      - run: make -C controller check

  # The semantic data product without a warehouse: service checks and dbt parse.
  semantics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
      - run: make -C semantics install
      - run: make -C semantics check

  # The Slack data application.
  notifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
      - run: make -C notifier install
      - run: make -C notifier check

  # The container images must at least build; deploy.yml pushes them from main.
  images:
    needs: changes
    if: ${{ needs.changes.outputs.images == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: semantics/Dockerfile
            context: . # bakes in semantics/dbt
          - dockerfile: contracts/Dockerfile
            context: . # bakes in contracts/*.odcs.yaml
          - dockerfile: notifier/Dockerfile
            context: notifier
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f ${{ matrix.dockerfile }} ${{ matrix.context }}

  # What needs BigQuery: the sample chunks are loaded into the CI dataset, the
  # dbt project is built and unit-tested there, and the semantics contract is
  # tested against the result. Runs only once the GCP project is wired up
  # (repository variable FROSTLOG_GCP_PROJECT_NUMBER), as frostlog-ci via
  # Workload Identity Federation; one run at a time because the dataset is shared.
  # A pull request from a fork gets no id-token, so it cannot take this job and is
  # not asked to; the unit checks above are what it is held to.
  warehouse:
    needs: changes
    if: >-
      ${{ needs.changes.outputs.warehouse == 'true'
          && vars.FROSTLOG_GCP_PROJECT_NUMBER != ''
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: frostlog-ci-warehouse
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      FROSTLOG_GCP_PROJECT: chanyou-frostlog # the service's settings (sample load)
      FROSTLOG_BQ_PROJECT: chanyou-frostlog  # dbt's profiles.yml (build, unit tests)
      FROSTLOG_BQ_DATASET_CI: frostlog_ci
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ vars.FROSTLOG_GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: frostlog-ci@${{ env.FROSTLOG_GCP_PROJECT }}.iam.gserviceaccount.com
      - run: make -C semantics install
      # ci-warehouse ends by handing the result to the contract-test job.
      - run: make -C contracts install
      - run: make -C semantics ci-warehouse
